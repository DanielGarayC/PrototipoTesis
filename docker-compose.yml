services:
  nifi:
    build:
      context: ./nifi-image
    image: tesis/nifi:2.7.2-pf06
    container_name: nifi_tesis
    ports:
      - "8443:8443"
    environment:
      SINGLE_USER_CREDENTIALS_USERNAME: admin
      SINGLE_USER_CREDENTIALS_PASSWORD: NiFiPassword123
    volumes:
      - ./nifi-conf:/opt/nifi/nifi-current/conf
      - ./data:/data
      - ./scripts:/opt/scripts
      - nifi_content:/opt/nifi/nifi-current/content_repository
      - nifi_flowfile:/opt/nifi/nifi-current/flowfile_repository
      - nifi_database:/opt/nifi/nifi-current/database_repository
      - nifi_provenance:/opt/nifi/nifi-current/provenance_repository
      - nifi_state:/opt/nifi/nifi-current/state
      - nifi_logs:/opt/nifi/nifi-current/logs
      - nifi_python_extensions:/opt/nifi/nifi-current/python_extensions
      - nifi_nar_extensions:/opt/nifi/nifi-current/nar_extensions
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: mysql_tesis
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${TESIS_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: tesis_lip
      MYSQL_USER: tesis_app
      MYSQL_PASSWORD: ${TESIS_MYSQL_APP_PASSWORD}
      TZ: UTC
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--default-time-zone=+00:00"]
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  central:
    build: ./central
    container_name: modulo_central_tesis
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: tesis_lip
      DB_USER: tesis_app
      DB_PASSWORD: ${TESIS_MYSQL_APP_PASSWORD}
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=10).close()"]
      interval: 30s
      timeout: 12s
      retries: 3
      start_period: 30s

volumes:
  mysql_data:
  nifi_content:
    external: true
    name: 811bd8646a5b3e8820af4e5794f4ef6a76f701f723c95134f779f973f2ac5a6f
